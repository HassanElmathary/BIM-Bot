# ChatGPT Desktop — append to %USERPROFILE%\.codex\config.toml, then restart ChatGPT.
# The BIM-Bot installer and the Revit plugin write this automatically.
[mcp_servers.BIM-Bot]
command = 'C:\Program Files\BIMBot\nodejs\node.exe'
args = ['C:\Program Files\BIMBot\server\build\index.js']
startup_timeout_sec = 30
tool_timeout_sec = 300

# Navisworks side of BIM-Bot (same server binary; navis_* tools route via
# BIMBOT_NAVIS_PORT to the Navisworks plugin on 8091). Also written automatically.
[mcp_servers.BIM-Bot-Navis]
command = 'C:\Program Files\BIMBot\nodejs\node.exe'
args = ['C:\Program Files\BIMBot\server\build\index.js']
env = { BIMBOT_NAVIS_PORT = "8091", BIMBOT_SCOPE = "navis" }
startup_timeout_sec = 30
tool_timeout_sec = 300
